name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 4 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Build-less extraction. Manual/autobuild build modes are NOT viable
        # for Kotlin 2.x on Android because the CodeQL compiler tracer fails
        # on modern Kotlin toolchains. Using build-mode: none performs source-level
        # extraction so CodeQL scans the codebase cleanly in CI.
        build-mode: none

    - name: Build for CodeQL
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
