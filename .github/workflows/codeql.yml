name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 4 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Build-less extraction. Manual/autobuild build modes are NOT viable
        # here: the CodeQL Kotlin extractor rejects the project's Kotlin
        # compiler ("2.4.20 is too recent ... supports versions below 2.4.20"),
        # so a traced build hard-fails. Revisit once CodeQL supports the
        # current Kotlin toolchain; until then accept the lower-fidelity
        # source extraction (GitHub surfaces it as "low analysis quality").
        build-mode: none

    - name: Build for CodeQL
      # Not needed for extraction with build-mode: none, but kept so compile
      # errors still fail CI alongside the Android CI workflow.
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
