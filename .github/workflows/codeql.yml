name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 4 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Build-less extraction for Java/Kotlin: CodeQL compiles nothing and
        # extracts directly from source, so analysis can't fail because the
        # traced Gradle build produced no code.
        build-mode: none

    - name: Build for CodeQL
      # Not needed for extraction with build-mode: none, but kept so compile
      # errors still fail CI alongside the Android CI workflow.
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
