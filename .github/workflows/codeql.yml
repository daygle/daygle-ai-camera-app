name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 4 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Manual build mode: the Gradle build below is traced, so CodeQL
        # extracts from real compilation with the Android SDK and full
        # dependency classpath. (build-mode: none is unsupported for Kotlin
        # and produced "low analysis quality" warnings.)
        build-mode: manual

    - name: Build for CodeQL
      # Traced by CodeQL to build the analysis database; also fails CI early
      # on compile errors, alongside the Android CI workflow. The Kotlin
      # compiler runs in-process because its daemon crashes under the CodeQL
      # tracer's LD_PRELOAD environment.
      run: >-
        ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache
        -Dkotlin.compiler.execution.strategy=in-process

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
