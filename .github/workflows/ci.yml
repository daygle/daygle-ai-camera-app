name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR builds are cancelled; every push to main is built to completion.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: always

      # Lint both variants first: warningsAsErrors is on, so any lint warning
      # fails the job before anything is built. --warning-mode=fail also fails
      # on Gradle deprecation warnings.
      - name: Lint
        run: ./gradlew lintDebug lintRelease --warning-mode=fail --stacktrace

      # One Gradle invocation, so configuration runs once. The (unsigned) release
      # bundle validates R8 minification and native debug symbol extraction on
      # every PR, not only at release.
      - name: Unit tests and release bundle (R8)
        run: ./gradlew testDebugUnitTest bundleRelease --warning-mode=fail --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DaygleAICamera-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
