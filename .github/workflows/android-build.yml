name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # wrapper-validation is enabled by default in setup-gradle@v6
          add-job-summary: always

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run checks and build APKs
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --warning-mode=all --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DaygleAICamera-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DaygleAICamera-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
