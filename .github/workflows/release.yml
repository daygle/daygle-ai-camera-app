name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Never cancel a release mid-publish; queue a re-pushed tag behind the running one.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release APK and Publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: always

      # versionCode must increase with every release, so derive it from the
      # semantic version in the tag (v1.2.3 -> 1002003) rather than the
      # workflow run number, which resets and is unrelated to the version.
      - name: Extract version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]})); MINOR=$((10#${BASH_REMATCH[2]})); PATCH=$((10#${BASH_REMATCH[3]}))
          if (( MAJOR > 2099 || MINOR > 999 || PATCH > 999 )); then
            echo "::error::Version $VERSION does not fit the versionCode scheme (MAJOR<=2099, MINOR<=999, PATCH<=999)"
            exit 1
          fi
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          PRERELEASE=false
          [[ -n "${BASH_REMATCH[4]}" ]] && PRERELEASE=true
          {
            echo "VERSION_NAME=$VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"
          echo "Releasing version $VERSION (versionCode $VERSION_CODE, prerelease $PRERELEASE)"

      # Sign with the upload keystore when the repository secrets are configured.
      # Without them the APK is unsigned and Android will refuse to install it.
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not set; the release APK will be unsigned and cannot be installed."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --warning-mode=all --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DaygleAICamera-apks-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.PRERELEASE }}

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
