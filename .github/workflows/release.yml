name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Never cancel a release mid-publish; queue a re-pushed tag behind the running one.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: always

      # versionCode must increase with every release, so derive it from the
      # semantic version in the tag (v1.2.3 -> 1002003) rather than the
      # workflow run number, which resets and is unrelated to the version.
      - name: Extract version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]})); MINOR=$((10#${BASH_REMATCH[2]})); PATCH=$((10#${BASH_REMATCH[3]}))
          if (( MAJOR > 2099 || MINOR > 999 || PATCH > 999 )); then
            echo "::error::Version $VERSION does not fit the versionCode scheme (MAJOR<=2099, MINOR<=999, PATCH<=999)"
            exit 1
          fi
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          PRERELEASE=false
          [[ -n "${BASH_REMATCH[4]}" ]] && PRERELEASE=true
          {
            echo "VERSION_NAME=$VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"
          echo "Releasing version $VERSION (versionCode $VERSION_CODE, prerelease $PRERELEASE)"

      # Release signing is driven by repository secrets (see README "Release
      # signing"). When they are absent the workflow keeps its old behaviour
      # and publishes the debug APK.
      - name: Check release signing secrets
        id: signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_B64 is not set; publishing the debug APK instead of a signed release APK (see README 'Release signing')."
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --warning-mode=all --stacktrace

      - name: Test and build debug APK (release signing not configured)
        if: steps.signing.outputs.enabled == 'false'
        run: ./gradlew testDebugUnitTest assembleDebug --warning-mode=all --stacktrace

      - name: Name APK after the version
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/DaygleAICamera-$VERSION_NAME-release.apk"
          else
            mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/DaygleAICamera-$VERSION_NAME-debug.apk"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DaygleAICamera-apks-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/*/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.PRERELEASE }}
