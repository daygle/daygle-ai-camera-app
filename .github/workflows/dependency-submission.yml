name: Dependency Submission

# GitHub's automatic dependency submission is enabled for this repository, so
# its generated "Automatic Dependency Submission (Gradle)" job (submit-gradle)
# also submits a graph on every push to main. That job runs on a dynamic event,
# which only gets a read-only Actions cache token, so its attempt to save the
# Gradle cache fails with "cache write denied: token has no writable scopes".
# The warning is harmless and the snapshot is still submitted.
#
# This workflow remains the authoritative submission: GitHub prefers a user
# submission over an automatic one for the same manifest. It also excludes the
# buildscript/plugin classpath, because packages resolved there (Android Gradle
# Plugin tooling such as bouncycastle, jose4j, jdom2, commons-lang3, httpclient)
# are build-only transitive dependencies that are not declared in any manifest,
# so Dependabot can never update them and its security-update jobs fail daily
# with `dependency_not_found`.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph-exclude-configurations: classpath
