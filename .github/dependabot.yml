version: 2

updates:
  # Gradle dependencies: scans build.gradle.kts files and the version catalog at gradle/libs.versions.toml.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "gradle"
      include: "scope"
    groups:
      compose:
        patterns:
          - "androidx.compose.*"
          - "com.google.android.compose.*"
      jetpack-core:
        patterns:
          - "androidx.core.*"
          - "androidx.lifecycle.*"
          - "androidx.navigation.*"
          - "androidx.work.*"
          - "androidx.datastore.*"
      google-services:
        patterns:
          - "com.google.android.gms.*"
          - "com.google.firebase.*"
          - "com.google.dagger.*"
          - "com.google.devtools.ksp*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      networking-and-images:
        patterns:
          - "com.squareup.*"
          - "com.jakewharton.*"
          - "io.coil-kt*"

  # GitHub Actions: keeps actions/checkout, actions/setup-java, actions/upload-artifact, etc. up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
