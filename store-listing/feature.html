<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1024px;height:500px;overflow:hidden;font-family:"DejaVu Sans","Liberation Sans",sans-serif;
 background:radial-gradient(circle at 22% 50%,#123a38 0%,#0F172A 45%,#0B1220 100%);color:#F0F6FC;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(61,220,151,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(61,220,151,.06) 1px,transparent 1px);background-size:40px 40px}
.icon{position:absolute;left:60px;top:90px;width:320px;height:320px;filter:drop-shadow(0 0 40px rgba(61,220,151,.35))}
.icon img{width:100%;height:100%}
.text{position:absolute;left:410px;top:0;bottom:0;right:50px;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font-size:54px;font-weight:700;letter-spacing:-1px;line-height:1.05}
h1 span{color:#3DDC97}
p{margin:18px 0 26px;font-size:25px;line-height:1.35;color:#C9D1D9}
.chips{display:flex;flex-wrap:wrap;gap:9px;flex-wrap:nowrap}
.chip{white-space:nowrap;border:1.5px solid rgba(61,220,151,.55);color:#D8FFEE;border-radius:999px;padding:7px 16px;font-size:17px;background:rgba(61,220,151,.08)}
</style></head><body><div class="grid"></div>
<div class="icon"><img src="lens.svg"></div>
<div class="text"><h1>Daygle <span>AI</span> Camera</h1>
<p>Your self-hosted AI cameras,<br>right in your pocket.</p>
<div class="chips"><div class="chip">Live view</div><div class="chip">AI search</div><div class="chip">Recordings</div><div class="chip">Alerts</div></div></div>
</body></html>
